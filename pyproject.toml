[project]
name = "inventory-dw-dss"
version = "0.1.0"
description = "Inventory data warehouse and decision support; OLTP is the source of record"
readme = "README.md"
authors = [
    { name = "ducklemon596", email = "thienquang050906@gmai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect==1.12.0",
    "dbt-clickhouse==1.10.3",
    "dbt-core==1.12.5",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
bootstrap = ["pandas>=3.1.1,<4"]
dev = ["pytest>=8,<10"]

[project.optional-dependencies]
mms = [
    "duckdb>=1.4,<2",
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
    "joblib>=1.4,<2",
]
ui = ["inventory-dw-dss[mms]", "streamlit>=1.40,<2"]

[project.scripts]
inventory-dw-dss = "inventory_dw_dss.cli:main"
inventory-mms = "inventory_dw_dss.mms.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
