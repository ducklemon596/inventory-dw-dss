# Unified local stack for the OLTP source and analytical warehouse.
# PostgreSQL and ClickHouse run as database servers. Run dbt locally with uv.
services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U inventory -d inventory']
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse:26.10.3.7
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-inventory_dw}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dbt}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dbt_local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user=$$CLICKHOUSE_USER --password=$$CLICKHOUSE_PASSWORD --query='SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  clickhouse_data:
