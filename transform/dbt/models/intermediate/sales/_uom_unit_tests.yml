version: 2
unit_tests:
- name: uom_stock_units_require_agreement_across_warehouses_and_movement_fields
  model: int_product_stock_units
  given:
  - input: ref('stg_inventory_movements')
    rows:
    - dataset_name: fixture
      product_id: 1
      warehouse_id: 1
      opening_stock_unit_id: 1
      received_unit_id: 1
      issued_unit_id: 1
      closing_stock_unit_id: 1
    - dataset_name: fixture
      product_id: 1
      warehouse_id: 2
      opening_stock_unit_id: 1
      received_unit_id: 1
      issued_unit_id: 1
      closing_stock_unit_id: 1
    - dataset_name: fixture
      product_id: 2
      warehouse_id: 1
      opening_stock_unit_id: 1
      received_unit_id: 1
      issued_unit_id: 1
      closing_stock_unit_id: 1
    - dataset_name: fixture
      product_id: 2
      warehouse_id: 2
      opening_stock_unit_id: 2
      received_unit_id: 2
      issued_unit_id: 2
      closing_stock_unit_id: 2
    - dataset_name: fixture
      product_id: 3
      warehouse_id: 1
      opening_stock_unit_id: 1
      received_unit_id: 2
      issued_unit_id: 1
      closing_stock_unit_id: 1
  - input: ref('stg_products')
    rows:
    - product_id: 1
      product_code: SKU_1
    - product_id: 2
      product_code: SKU_2
    - product_id: 3
      product_code: SKU_3
  - input: ref('stg_units')
    rows:
    - unit_id: 1
      unit_code: Tab
    - unit_id: 2
      unit_code: Box
  expect:
    rows:
    - dataset_name: fixture
      product_id: 1
      stock_unit_id: 1
      stock_unit_code: Tab
      recorded_stock_unit_count: 1
      inconsistent_unit_movement_count: 0
    - dataset_name: fixture
      product_id: 2
      stock_unit_id: null
      stock_unit_code: null
      recorded_stock_unit_count: 2
      inconsistent_unit_movement_count: 0
    - dataset_name: fixture
      product_id: 3
      stock_unit_id: null
      stock_unit_code: null
      recorded_stock_unit_count: 1
      inconsistent_unit_movement_count: 1
