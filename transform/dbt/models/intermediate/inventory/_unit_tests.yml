- name: segments_reset_at_recorded_opening_and_keep_exact_decimals
  model: int_inventory_segments
  given:
  - input: ref('int_inventory_ledger_ordered')
    rows:
    - inventory_movement_id: 10
      dataset_name: fixture
      dataset_row_number: 10
      product_id: 1
      warehouse_id: 1
      movement_at: '2024-02-29 10:00:00.000000'
      opening_stock_quantity: '-1.000001'
      closing_stock_quantity: '-1.000003'
      recorded_delta_qty: '-0.000002'
      is_ledger_start: 1
      is_discontinuity: 0
      boundary_reason: LEDGER_START
    - inventory_movement_id: 20
      dataset_name: fixture
      dataset_row_number: 20
      product_id: 1
      warehouse_id: 1
      movement_at: '2024-02-29 10:00:00.000000'
      opening_stock_quantity: '10.123456'
      closing_stock_quantity: '8.123455'
      recorded_delta_qty: '-2.000001'
      is_ledger_start: 0
      is_discontinuity: 1
      boundary_reason: OPENING_DIFFERS_FROM_PREVIOUS_CLOSING
    - inventory_movement_id: 30
      dataset_name: fixture
      dataset_row_number: 30
      product_id: 1
      warehouse_id: 1
      movement_at: '2024-02-29 10:00:00.000000'
      opening_stock_quantity: '8.123455'
      closing_stock_quantity: '8.123455'
      recorded_delta_qty: '0'
      is_ledger_start: 0
      is_discontinuity: 0
      boundary_reason: CONTINUOUS
  expect:
    rows:
    - dataset_row_number: 10
      segment_start_sequence: 10
      segment_end_sequence: 10
      segment_id: '["fixture",1,1,10]'
      segment_opening_quantity: '-1.000001'
      segment_cumulative_delta_qty: '-0.000002'
      reconstructed_closing_quantity: '-1.000003'
    - dataset_row_number: 20
      segment_start_sequence: 20
      segment_end_sequence: 30
      segment_id: '["fixture",1,1,20]'
      segment_opening_quantity: '10.123456'
      segment_cumulative_delta_qty: '-2.000001'
      reconstructed_closing_quantity: '8.123455'
    - dataset_row_number: 30
      segment_start_sequence: 20
      segment_end_sequence: 30
      segment_id: '["fixture",1,1,20]'
      segment_opening_quantity: '10.123456'
      segment_cumulative_delta_qty: '-2.000001'
      reconstructed_closing_quantity: '8.123455'
