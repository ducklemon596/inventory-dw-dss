version: 2
unit_tests:
- name: inventory_keeps_unknown_returns_negatives_and_actual_flow_direction
  description: Recorded receipts and issues determine quantity changes while unknown classifications and
    negative balances remain intact.
  model: int_inventory_movements_enriched
  given:
  - input: ref('stg_inventory_movements')
    rows:
    - inventory_movement_id: 1
      dataset_name: fixture
      dataset_row_number: 21
      inventory_document_id: 1
      product_id: 1
      warehouse_id: 1
      movement_at: '2024-02-29 10:00:00.123456'
      transaction_type: UNKNOWN
      transaction_description: Unresolved description
      opening_stock_quantity: '-1.000001'
      received_quantity: '0.000000'
      issued_quantity: '0.000002'
      closing_stock_quantity: '-1.000003'
      opening_stock_unit_id: 1
      received_unit_id: 1
      issued_unit_id: 1
      closing_stock_unit_id: 1
    - inventory_movement_id: 2
      dataset_name: fixture
      dataset_row_number: 22
      inventory_document_id: 1
      product_id: 1
      warehouse_id: 1
      movement_at: '2024-02-29 11:00:00.000000'
      transaction_type: RETURN
      opening_stock_quantity: '10.000000'
      received_quantity: '2.123456'
      issued_quantity: '0.000000'
      closing_stock_quantity: '12.123456'
      opening_stock_unit_id: 1
      received_unit_id: 1
      issued_unit_id: 1
      closing_stock_unit_id: 1
    - inventory_movement_id: 3
      dataset_name: fixture
      dataset_row_number: 23
      inventory_document_id: 1
      product_id: 1
      warehouse_id: 1
      movement_at: '2024-02-29 12:00:00.000000'
      transaction_type: RETURN
      opening_stock_quantity: '3.000000'
      received_quantity: '0.000000'
      issued_quantity: '1.000000'
      closing_stock_quantity: '2.000000'
      opening_stock_unit_id: 1
      received_unit_id: 1
      issued_unit_id: 1
      closing_stock_unit_id: 1
    - inventory_movement_id: 4
      dataset_name: fixture
      dataset_row_number: 24
      inventory_document_id: 1
      product_id: 1
      warehouse_id: 1
      movement_at: '2024-02-29 13:00:00.000000'
      transaction_type: UNKNOWN
      opening_stock_quantity: '0.000000'
      received_quantity: '0.000000'
      issued_quantity: '0.000000'
      closing_stock_quantity: '0.000000'
      opening_stock_unit_id: 1
      received_unit_id: 1
      issued_unit_id: 1
      closing_stock_unit_id: 1
  - input: ref('stg_inventory_documents')
    rows:
    - inventory_document_id: 1
      inventory_document_number: DOC001
  - input: ref('stg_products')
    rows:
    - product_id: 1
      product_code: '0001'
  - input: ref('stg_warehouses')
    rows:
    - warehouse_id: 1
      warehouse_name: Pharmacy
  - input: ref('stg_units')
    rows:
    - unit_id: 1
      unit_code: Tab
  expect:
    rows:
    - inventory_movement_id: 1
      dataset_row_number: 21
      transaction_type: UNKNOWN
      transaction_description: Unresolved description
      closing_stock_quantity: '-1.000003'
      recorded_delta_qty: '-0.000002'
      has_negative_opening_stock: 1
      has_negative_closing_stock: 1
      is_unknown_movement: 1
    - inventory_movement_id: 2
      dataset_row_number: 22
      transaction_type: RETURN
      transaction_description: null
      closing_stock_quantity: '12.123456'
      recorded_delta_qty: '2.123456'
      has_negative_opening_stock: 0
      has_negative_closing_stock: 0
      is_unknown_movement: 0
    - inventory_movement_id: 3
      dataset_row_number: 23
      transaction_type: RETURN
      transaction_description: null
      closing_stock_quantity: '2.000000'
      recorded_delta_qty: '-1.000000'
      has_negative_opening_stock: 0
      has_negative_closing_stock: 0
      is_unknown_movement: 0
    - inventory_movement_id: 4
      dataset_row_number: 24
      transaction_type: UNKNOWN
      transaction_description: null
      closing_stock_quantity: '0.000000'
      recorded_delta_qty: '0.000000'
      has_negative_opening_stock: 0
      has_negative_closing_stock: 0
      is_unknown_movement: 1
