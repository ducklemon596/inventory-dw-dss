    data_type: Nullable(String)
    description: Continuity segment of the preceding recorded movement.
  - name: segment_start_sequence
    data_type: UInt32
    description: Export sequence of the first movement in the continuity segment.
  - name: segment_end_sequence
    data_type: UInt32
    description: Export sequence of the last movement in the continuity segment.
  - name: segment_boundary_reason
    data_type: String
    description: Recorded continuity condition that starts the segment.
  - name: diagnostic_class
    data_type: String
    description: Whether the descriptions adjacent to the gap mention a stock count.
  - name: diagnostic_evidence
    data_type: String
    description: Observed evidence used to describe the gap.
  data_tests:
  - unique_grain:
      arguments:
        columns: *id003
