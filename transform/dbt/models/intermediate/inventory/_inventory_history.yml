        data_type: UInt8
        description: Whether a preceding observation exists and its closing equals the current opening quantity.

      - name: boundary_reason
        data_type: String
        description: Reason the movement begins a ledger or a new continuity segment, or indicates continuity.

      - name: segment_start_sequence
        data_type: UInt32
        description: Source row number of the opening anchor for this continuity segment.

      - name: segment_id
        data_type: String
        description: >-
          Continuity segment identified by dataset, product, warehouse and the source row at its opening anchor.
        data_tests:
          - not_null

      - name: segment_end_sequence
        data_type: UInt32
        description: Source row number of the final observed movement in this continuity segment.

      - name: segment_opening_quantity
        data_type: Decimal(18, 6)
        description: >-
          Recorded opening quantity on the first movement of the segment, in the ledger unit; this anchor is not
          an added movement.

      - name: segment_started_at
        data_type: DateTime64(6)
        description: Event time recorded on the first source-ordered movement in the segment.

      - name: segment_ended_at
        data_type: DateTime64(6)
        description: Event time recorded on the last source-ordered movement in the segment.

      - name: segment_boundary_reason
        data_type: String
        description: Recorded continuity condition that starts the segment.

      - name: segment_cumulative_delta_qty
        data_type: Decimal(38, 6)
        description: >-
          Sum of recorded received minus issued quantities from the segment anchor through this movement, in the
          ledger unit.

      - name: reconstructed_closing_quantity
        data_type: Decimal(38, 6)
        description: >-
          Segment opening anchor plus cumulative recorded received minus issued quantities through this movement,
          in the ledger unit.
