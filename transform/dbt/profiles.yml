inventory_dw:
  target: local
  outputs:
    local:
      type: clickhouse
      schema: "{{ env_var('CLICKHOUSE_DB', 'inventory_dw') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'dbt') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'dbt_local') }}"
      secure: false
      verify: false
      threads: 4
